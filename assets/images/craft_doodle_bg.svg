<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Subtle Aesthetic Handcrafted Doodles Pattern -->
  <!-- Warm Terracotta & Sage Green tones, soft muted transparency (0.18 - 0.28) -->
  
  <!-- 1. Doodled Ribbon Bow -->
  <g transform="translate(30, 28) scale(0.85)" stroke="#A85244" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.22">
    <!-- Center knot -->
    <circle cx="20" cy="18" r="3.2" fill="#A85244" />
    <!-- Left Loop -->
    <path d="M17 16 C9 8 3 13 5 21 C7 27 16 20 17 18 Z" />
    <!-- Right Loop -->
    <path d="M23 16 C31 8 37 13 35 21 C33 27 24 20 23 18 Z" />
    <!-- Ribbon Streamers / Tails -->
    <path d="M17 21 C14 30 8 34 5 36" />
    <path d="M23 21 C26 30 32 34 35 36" />
  </g>

  <!-- 2. Four-Point Sparkle Star (Top Right) -->
  <path d="M175 42 Q175 52 185 52 Q175 52 175 62 Q175 52 165 52 Q175 52 175 42 Z" fill="#A85244" opacity="0.20"/>
  
  <!-- 3. Little Hand-Drawn Heart (Center) -->
  <path d="M120 115 C120 109 125 105 130 105 C134 105 137.5 108 138 111 C138.5 108 142 105 146 105 C151 105 156 109 156 115 C156 123 143 132 138 136 C133 132 120 123 120 115 Z" 
        stroke="#A85244" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.24" fill="none" />

  <!-- 4. Delicate Botanical Flower / Stem (Bottom Left) -->
  <g transform="translate(42, 160) scale(0.8)" stroke="#3D6E4C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.22">
    <path d="M12 40 Q18 24 30 14" fill="none" />
    <!-- Tiny leaves -->
    <path d="M19 28 Q26 25 28 30 Q22 34 19 28 Z" fill="#3D6E4C" />
    <path d="M15 34 Q8 30 10 25 Q16 28 15 34 Z" fill="#3D6E4C" />
    <!-- Flower bud -->
    <circle cx="31" cy="13" r="3.5" fill="#A85244" stroke="none" />
  </g>

  <!-- 5. Cute Secondary Sparkle (Bottom Right) -->
  <path d="M205 175 Q205 182 212 182 Q205 182 205 189 Q205 182 198 182 Q205 182 205 175 Z" fill="#A85244" opacity="0.18"/>

  <!-- 6. Playful little ribbon swirl flourish (Center Left) -->
  <path d="M15 110 Q25 98 35 106 Q45 114 40 126" stroke="#A85244" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.18" />

  <!-- 7. Tiny Soft Craft Freckles / Dots -->
  <circle cx="95" cy="45" r="1.3" fill="#A85244" opacity="0.18"/>
  <circle cx="215" cy="100" r="1.2" fill="#A85244" opacity="0.18"/>
  <circle cx="105" cy="195" r="1.3" fill="#A85244" opacity="0.18"/>
  <circle cx="75" cy="140" r="1" fill="#3D6E4C" opacity="0.18"/>
</svg>